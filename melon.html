<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>melon 페이지</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="./CSS/melon.css">
</head>
<body>
    <header class="mel-header">
        <div class="mel-header-in">
            <h1 class="mel-logo">melon</h1>
            <span class="mel-tab">TOP 100</span>
        </div>
    </header>

    <main class="mel-wrap">
        <section class="mel-section">
            <div class="mel-title-row">
                <h2>실시간 TOP 12</h2>
                <div class="mel-nav">
                    <button type="button" class="mel-prev" aria-label="이전">‹</button>
                    <button type="button" class="mel-next" aria-label="다음">›</button>
                </div>
            </div>
            <div class="swiper top-swiper" aria-label="TOP 12 슬라이드 배너">
                <div class="swiper-wrapper" id="topSlides"></div>
                <div class="swiper-pagination"></div>
            </div>
        </section>

        <section class="mel-section">
            <div class="mel-title-row">
                <h2>TOP 13 - 100</h2>
            </div>
            <ol class="mel-grid" id="chartList"></ol>
        </section>

        <p class="mel-error" id="melError" hidden></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="./js/melon.js"></script>
</body>
</html>
